[package]
name = "ohm"
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Asciiverse electronics desk puzzle with a real circuit solver; Rust + Ratatui"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
gilrs = { version = "0.11", optional = true, default-features = false, features = ["xinput"] }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
